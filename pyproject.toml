[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight"
version = "2.0.0"
description = "Hindsight: investigates production incidents with NVIDIA Nemotron on Nebius Token Factory and writes the postmortem"
authors = [
    {name = "L Mohit Jain"},
    {name = "Tanush Deepak"},
    {name = "Utkarsh Singh Yadav"}
]
dependencies = [
    "pydantic>=2.4.0",
    "openenv-core==0.2.3",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "mcp>=2.0,<3"
]
requires-python = ">=3.11"

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "httpx>=0.25.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
